[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lingxi-x1"
version = "0.1.0"
description = "Lingxi X1 portable signal measurement desktop application"
requires-python = ">=3.11"
dependencies = ["numpy", "PySide6", "pyqtgraph", "pyserial"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
