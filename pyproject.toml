[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lingxi-x1"
version = "0.5.1"
description = "Lingxi X1 portable signal measurement desktop application"
requires-python = ">=3.11"
dependencies = ["numpy", "PySide6", "pyqtgraph", "pyserial"]
license = "MIT"
authors = [{ name = "sun8150360" }]

[project.urls]
Homepage = "https://github.com/sun8150360/lingxi-x1"
Releases = "https://github.com/sun8150360/lingxi-x1/releases"
Issues = "https://github.com/sun8150360/lingxi-x1/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
